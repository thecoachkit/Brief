name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Trova ed estrai lo zip del progetto più recente
        run: |
          ZIP="$(git -c core.quotePath=false log -1 --name-only --diff-filter=AM --format= -- '*.zip' | grep -m1 .)" || true
          if [ -z "$ZIP" ]; then echo "Nessuno zip trovato nel repository"; exit 1; fi
          echo "Uso lo zip: $ZIP"
          unzip -q "$ZIP"
          ls
      - name: Applica aggiornamenti PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("rip-android/app/src/main/java/it/rip/riepilogo")
          main = root / "MainActivity.kt"
          pdf = root / "PdfBuilder.kt"
          def replace_exact(path, old, new):
              text = path.read_text()
              if text.count(old) != 1:
                  raise RuntimeError(f"Modifica non applicabile a {path}: occorrenze {text.count(old)}")
              path.write_text(text.replace(old, new))
          replace_exact(main,
              '            SimpleDateFormat("dd/MM/yyyy", Locale.ITALY).format(now),\n            SimpleDateFormat("dd/MM/yyyy \'alle\' HH:mm", Locale.ITALY).format(now)',
              '            SimpleDateFormat("dd/MM/yyyy", Locale.ITALY).format(now)')
          replace_exact(pdf,
              'fun build(context: Context, blocks: List<SessionParser.Block>, date: String, generatedAt: String): ByteArray',
              'fun build(context: Context, blocks: List<SessionParser.Block>, date: String): ByteArray')
          replace_exact(pdf,
              '        val footP = paint(9f, geologica(context, bold = false), mutedBrown)\n',
              '')
          replace_exact(pdf,
              '        for (b in blocks) {',
              '        val pdfBlocks = blocks.sortedBy { if (it.title == SessionParser.Key.OBIETTIVO.title) 0 else 1 }\n        for (b in pdfBlocks) {')
          replace_exact(pdf,
              '        w.space(4f)\n        w.rule(rulePaint)\n        w.space(8f)\n        w.draw(layout("Generato il $generatedAt", footP, width, Layout.Alignment.ALIGN_CENTER), MARGIN)\n',
              '')
          print("PDF aggiornato: obiettivo al primo posto; data di generazione rimossa")
          PY
      - name: Selezione manuale data e titoli PDF
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root = Path("rip-android/app/src/main/java/it/rip/riepilogo")
          main = root / "MainActivity.kt"
          pdf = root / "PdfBuilder.kt"
          def change(path, before, after):
              s = path.read_text()
              if s.count(before) != 1:
                  raise RuntimeError(f"Atteso esattamente un riferimento in {path}: {before[:80]!r}; trovati {s.count(before)}")
              path.write_text(s.replace(before, after))
          change(main, "import android.app.AlertDialog\n", "import android.app.AlertDialog\nimport android.app.DatePickerDialog\n")
          change(main, "import java.util.Date\n", "import java.util.Date\nimport java.util.Calendar\n")
          change(main,
              '        btnSave.setOnClickListener { savePdf() }\n        btnShare.setOnClickListener { sharePdf() }',
              '        btnSave.setOnClickListener { askSessionDate { date -> savePdf(date) } }\n        btnShare.setOnClickListener { askSessionDate { date -> sharePdf(date) } }')
          change(main,
              '    /** Genera il PDF dal testo che c’è ora nei riquadri (quindi con le tue correzioni). */',
              '    /** Genera il PDF dal testo che c’è ora nei riquadri (quindi con le tue correzioni). */') if False else None
          change(main,
              '    private fun renderPdf(): ByteArray {',
              '''    /** Chiede la data effettiva della sessione prima di salvare o condividere. */
              private fun askSessionDate(onSelected: (String) -> Unit) {
                  val today = Calendar.getInstance()
                  DatePickerDialog(
                      this,
                      { _, year, month, day ->
                          val chosen = String.format(Locale.ITALY, "%02d/%02d/%04d", day, month + 1, year)
                          onSelected(chosen)
                      },
                      today.get(Calendar.YEAR),
                      today.get(Calendar.MONTH),
                      today.get(Calendar.DAY_OF_MONTH)
                  ).apply {
                      setTitle("Data della sessione")
                      show()
                  }
              }

              private fun renderPdf(sessionDate: String): ByteArray {'''.replace('\n              ', '\n    '))
          change(main,
              '''        val now = Date()
                  pdfName = "riepilogo_" + SimpleDateFormat("ddMMyyyy_HHmm", Locale.ITALY).format(now) + ".pdf"
                  return PdfBuilder.build(
                      this,
                      SessionParser.finalBlocks(edited),
                      SimpleDateFormat("dd/MM/yyyy", Locale.ITALY).format(now)
                  )'''.replace('\n                  ', '\n        '),
              '''        val now = Date()
                  val fileDate = sessionDate.replace("/", "")
                  pdfName = "riepilogo_" + fileDate + "_" + SimpleDateFormat("HHmmss", Locale.ITALY).format(now) + ".pdf"
                  return PdfBuilder.build(
                      this,
                      SessionParser.finalBlocks(edited),
                      sessionDate
                  )'''.replace('\n                  ', '\n        '))
          change(main, '    private fun savePdf() {', '    private fun savePdf(sessionDate: String) {')
          change(main, '            pdf = renderPdf()', '            pdf = renderPdf(sessionDate)')
          change(main, '    private fun sharePdf() {', '    private fun sharePdf(sessionDate: String) {')
          change(main, '            val bytes = renderPdf()', '            val bytes = renderPdf(sessionDate)')
          change(pdf, 'b.title.uppercase(Locale.ITALY)', 'b.title')
          print("Data sessione selezionabile e titoli PDF in grassetto senza maiuscolo forzato.")
          PY
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.7"
      - name: Scarica il modello vocale italiano (Vosk, Apache 2.0)
        working-directory: rip-android
        run: |
          mkdir -p app/src/main/assets
          curl -fL -o model.zip https://alphacephei.com/vosk/models/vosk-model-small-it-0.22.zip
          unzip -q model.zip -d app/src/main/assets
          mv app/src/main/assets/vosk-model-small-it-0.22 app/src/main/assets/model-it
          rm model.zip
          ls app/src/main/assets/model-it
      - name: Compila l'APK
        working-directory: rip-android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v6
        with:
          name: rip-apk
          path: rip-android/app/build/outputs/apk/debug/app-debug.apk
